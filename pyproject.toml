[project]
name = "ai-lab-assistant"
version = "0.0.1"
description = "Local, in-character AI assistant for the SFSU AI Lab (runs on a GB10 via Ollama)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# All runtime deps are pure Python or ship manylinux aarch64 wheels (pydantic-core, pyyaml).
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "gb10: needs the real GB10 + Ollama (skipped unless RUN_GB10=1)",
]
