# `make chat-lab`: 10 real lab questions through the full pipeline (engineer-owned smoke
# run, not an eval set). Each question starts a fresh visitor (/reset), so answers can't
# lean on the one before. Needs `make ingest` first.
# For per-question retrieval detail (top chunks + scores + hints) use `make rag-diagnose`.
#
# Updated 2026-11-10 for the 12-file lab_docs/ (no TODO sections left). Every question
# below is answered by the docs; for "When does the AI Lab meet?" the docs give the room
# (LIB 260) and say times aren't published, so contact ai@sfsu.edu.
# Note for 6: system prompt rule 4 says not to state SFSU policy. Until the designer's
# attribution tweak (DES21) lands, pointing to sfsu.edu instead of answering is expected.
steps:
  - Where is the AI Studio?
  - /reset
  - Can I just stop by the AI Studio?
  - /reset
  - What AI clubs meet every week?
  - /reset
  - What AI events are coming up in November?
  - /reset
  - Where can I 3D print something on campus?
  - /reset
  - Can I use ChatGPT on my homework?
  - /reset
  - Does SFSU have a master's degree in AI?
  - /reset
  - What's the campus police non-emergency number?
  - /reset
  - How do I join the AI Lab?
  - /reset
  - When does the AI Lab meet?
