<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ada</title>
<!--
  The kiosk screen (M5a, light theme). Spec: docs/ui-spec.md v3. Reference mockup:
  ui/mockups/ada.html. Served by app/server.py, which replaces the BOOT marker below with the
  bot name and the UI copy (content/ui_strings.yaml), so the page has its words before the
  websocket connects. Nothing loads from the network: Three.js (ui/vendor) and Inter
  (ui/fonts) are bundled, and the CSP is 'self' only.
  Staff: ` opens the typing box (debug fallback). /ui/?debug=1 shows the state panel.
-->
<link rel="stylesheet" href="kiosk.css">
<!--BOOT-->
</head>
<body>
<div id="viewport">
<div id="stage" aria-label="Ada kiosk screen">
  <canvas id="blob" aria-hidden="true"></canvas>
  <div id="tap" aria-hidden="true"></div>
  <div id="notice"></div>
  <div id="mic" role="status" aria-live="polite"><span class="dot"></span><span id="mictext"></span></div>
  <div id="statusword" aria-live="polite"></div>
  <div id="idlecap" aria-hidden="true"></div>
  <div id="captions" aria-live="polite"></div>
  <div id="rest" role="status"><h1 id="resttitle"></h1><p id="restbody"></p></div>
  <div id="bottom">
    <button id="talk" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <span id="talktext"></span>
    </button>
    <div id="typing">
      <input id="input" type="text" maxlength="1200" autocomplete="off" autocorrect="off"
             autocapitalize="off" spellcheck="false" aria-label="Type a question">
      <span id="hint"></span>
    </div>
  </div>
</div>
</div>
<script type="module" src="kiosk.js"></script>
</body>
</html>
