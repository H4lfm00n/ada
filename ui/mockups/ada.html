<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ada · kiosk mockup (v3.1: glass orb, screen + spoken modes)</title>
<!--
  Designer mockup for docs/ui-spec.md v3.1. Built on the REAL kiosk modules so the review
  shows exactly what ships: ../blob.js (Ada's glass orb, D64/D66), ../cards.js and the real
  stylesheets. Fake data only, no server. Copy mirrors content/ui_strings.yaml v3 and
  content/cards.yaml (placeholder QR cards, DES53).
  Open: from the repo root run `python3 -m http.server 8000`, then
  http://localhost:8000/ui/mockups/ada.html  (ES modules don't load from file://).
  Replaces the v3 wireframe mockup (Three.js r128 from a CDN).
-->
<link rel="stylesheet" href="../kiosk.css">
<link rel="stylesheet" href="../cards.css">
<link rel="stylesheet" href="cards-preview.css">
<link rel="stylesheet" href="ada.css">
</head>
<body>
<div id="viewport">
<div id="stage" aria-label="Ada kiosk screen">
  <canvas id="blob" aria-hidden="true"></canvas>
  <div id="tap" aria-hidden="true"></div>
  <div id="notice"></div>
  <div id="mic" role="status" aria-live="polite"><span class="dot"></span><span id="mictext"></span></div>
  <div id="statusword" aria-live="polite"></div>
  <div id="idlecap" aria-hidden="true"></div>
  <div id="captions" aria-live="polite"></div>
  <div id="rest" role="status"><h1 id="resttitle"></h1><p id="restbody"></p></div>
  <div id="bottom">
    <button id="talk" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <span id="talktext"></span>
    </button>
    <div id="typing">
      <input id="input" type="text" maxlength="1200" autocomplete="off" spellcheck="false" aria-label="Type a question">
      <span id="hint"></span>
    </div>
  </div>
</div>
</div>

<div id="panel">
  <div class="row"><span class="lbl">Mode</span>
    <button data-mode="screen" class="on">Screen (typed MVP, now)</button>
    <button data-mode="spoken">Spoken (after M6a)</button>
    <button id="demo"><b>▶ Play a visit</b></button>
    <label><input type="checkbox" id="rm"> Reduced motion</label>
  </div>
  <div class="row"><span class="lbl">State</span>
    <button data-s="idle">Idle</button><button data-s="waking">Waking</button>
    <button data-s="listening">Listening / typing</button><button data-s="thinking">Thinking</button>
    <button data-s="speaking">Speaking</button><button data-s="confused">Confused</button>
    <button data-s="out">Out of order</button><button data-s="lost">Connection lost</button>
  </div>
  <div class="row"><span class="lbl">Cards</span>
    <button data-flow="yes">Proposal QR → "Yes"</button>
    <button data-flow="notyet">Discord QR → "Not yet" → "Yes"</button>
    <button data-flow="else">QR → asks something else</button>
    <button data-flow="timeout">QR → walks away</button>
  </div>
  <div class="row"><span class="lbl">Idle</span><span id="acts"></span>
    <button id="auto">Auto-rotate</button></div>
  <div class="note">Both QR cards are MVP placeholders: they open SFSU's AI for Students page (scannable). Type in the box in screen mode; tap the orb or the pill to start.</div>
</div>
<script type="module" src="ada.js"></script>
</body>
</html>
