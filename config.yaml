# AI Lab Assistant runtime config.
# Every key can be overridden with an env var: ADA_<KEY_IN_UPPERCASE>
#   e.g.  ADA_CHAT_MODEL=gemma4:12b make bench
# Use a different file with ADA_CONFIG=/path/to/config.yaml.

# --- Character ---------------------------------------------------------------
bot_name: Dum-E

# --- Ollama (must be localhost: no runtime network calls off the machine) ----
ollama_url: http://localhost:11434
request_timeout_s: 120        # model loads can take a while on first call
keep_alive: 30m               # keep models resident between visitors

# --- Models (tags exactly as shown by `ollama list`) -------------------------
chat_model: qwen3.8:27b
guard_model: llama-guard3:8b          # proposed in M0; pull before `make health`
embed_model: qwen3-embedding:0.6b     # proposed in M0; pull before `make health`

# --- Generation ---------------------------------------------------------------
think: false                  # thinking OFF for user-facing replies (latency)
temperature: 0.7
num_ctx: 8192
max_reply_tokens: 256

# --- Sessions -----------------------------------------------------------------
session_timeout_s: 120        # new visitor = fresh context. TODO(PM): confirm
max_history_messages: 20      # oldest turns dropped beyond this (user + assistant messages)

# --- Content (designer-owned files, relative to repo root) ---------------------
system_prompt_file: prompts/system_prompt.md
lines_file: content/lines.yaml
timezone: America/Los_Angeles  # fills {{current_time}} in the system prompt

# --- Lab knowledge (RAG, M2) ----------------------------------------------------
# Re-run `make ingest` after editing any file in lab_docs_dir.
lab_docs_dir: lab_docs                # evals point this at evals/fixtures/lab_docs
rag_index_dir: data/rag               # one JSON index per docs folder; never committed
rag_top_k: 4                          # max chunks per question
rag_min_score: 0.35                   # cosine cutoff; calibrate with `make rag-probe`. TODO(PM): confirm after probe
rag_max_context_chars: 3000           # cap on retrieved text per turn (prefill latency)
rag_timeout_s: 5                      # embedding the question; on timeout: no docs ("not sure")
# Qwen3-Embedding expects an instruction on queries (not on documents). "" disables it.
rag_query_instruction: "Given a question from a visitor to a university AI lab, retrieve the lab document sections that answer it"

# --- Latency targets (brief section 8) -----------------------------------------
target_first_token_s: 1.5
target_decode_tok_s: 10.0     # proposal: comfortably faster than reading speed. TODO(PM): confirm
